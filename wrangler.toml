# Cloudflare Worker: serves the built game (dist/).
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy
# To serve it on a subdomain of your own domain (for example ages.example.com), uncomment the route
# below and put in your hostname. The domain must be on Cloudflare; the DNS record is made for you.
name = "ages-of-earth"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# routes = [
#   { pattern = "ages.example.com", custom_domain = true }
# ]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Cloudflare Workers Builds deploys every non-production branch with `wrangler preview`, which refuses to
# run without this block (the build failed at the deploy step on every pull request). Empty is enough: a
# preview serves the game but has no online rooms, because previews don't carry Durable Object bindings.
[previews]

# Online rooms: one Durable Object per room keeps the match's clock and record.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Cloud saves (#290): one Durable Object per player's save key keeps their saved matches.
[[durable_objects.bindings]]
name = "VAULTS"
class_name = "Vault"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Vault"]
