# The full tier (AGENTS.md §5): build, unit tests and the slow tests in tests/slow/, once a day on main
# and on demand, so agents don't run the slow tests after every change. A failure opens (or adds to) an
# issue labelled ci-periodic and ready, which goes ahead of new features (docs/team.md).
# GitHub runs scheduled workflows only from the default branch, so this starts once main is the default.
name: periodic

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

concurrency:
  group: periodic
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit tests (the quick tier)
        run: npm test
      - name: Browser for the smoke test
        run: npx playwright-core install --with-deps chromium
      # The atlas survey generates hundreds of worlds, and the smoke test drives a software-GL browser.
      # Both have fixed time budgets (15 s a test; 30 s a screenshot) that the CPU-heavy campaign proofs
      # starve when files run side by side (periodic runs 4 and 5 failed that way). Run each on its own;
      # every test keeps its limits.
      - name: Slow tests (except Seed Atlas and the browser smoke test)
        id: slow
        run: npm run test:slow -- --exclude tests/slow/seed-atlas.test.ts --exclude tests/slow/browser-smoke.test.ts
      - name: Seed Atlas survey (isolated)
        if: ${{ !cancelled() && steps.slow.outcome != 'skipped' }}
        run: npm run test:slow -- tests/slow/seed-atlas.test.ts
      - name: Browser smoke test (isolated)
        if: ${{ !cancelled() && steps.slow.outcome != 'skipped' }}
        env:
          CHROMIUM_PATH: ''
          SMOKE_SHOTS: ${{ github.workspace }}/smoke-shots
        run: npm run test:slow -- tests/slow/browser-smoke.test.ts
      - name: Smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: smoke-shots
          if-no-files-found: ignore
      - name: Report the failure on the board
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for label in ci-periodic ready lane:tooling; do gh label create "$label" --force >/dev/null; done
          body="The periodic full check failed on \`main\` at ${GITHUB_SHA::7}: $RUN_URL
          Read the failing step's log, then fix it or revert the pull request that caused it (AGENTS.md §5)."
          open=$(gh issue list --label ci-periodic --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Periodic check failed on main" --label ci-periodic --label ready --label lane:tooling --body "$body"
          fi
